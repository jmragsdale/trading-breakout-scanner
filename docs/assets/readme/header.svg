<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-label="Breakout and GCR for TradingView. 3 Pine scripts: two signal indicators and one chart-data exporter. Includes a separate Python displacement-wick research model."><title>Breakout and GCR for TradingView. 3 Pine scripts: two signal indicators and one chart-data exporter. Includes a separate Python displacement-wick research model.</title><rect width="1440" height="500" rx="20" fill="#101f2a"/><path d="M64 61H1376" stroke="#33454e"/><path d="M64 61H188" stroke="#72ddbd" stroke-width="4"/><text x="64" y="40" fill="#f1f4ee" font-family="'DIN Alternate', 'Arial Narrow', Arial, sans-serif" font-size="20" font-weight="700" >J / R</text><text x="1376" y="40" fill="#b7c8ca" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="end" letter-spacing="2">TRADING RESEARCH  /  TRADINGVIEW</text><text x="64" y="121" fill="#72ddbd" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">INDICATORS + RESEARCH</text><text x="60" y="223" fill="#f1f4ee" font-family="'DIN Alternate', 'Arial Narrow', Arial, sans-serif" font-size="88" font-weight="700" >Breakout &amp; GCR</text><text x="64" y="286" fill="#f1f4ee" font-family="'DIN Alternate', 'Arial Narrow', Arial, sans-serif" font-size="36" font-weight="400" >Pine indicators. Traceable research.</text><text x="64" y="334" fill="#b7c8ca" font-family="Arial, sans-serif" font-size="25" font-weight="400" >Chart signals, export tools and practical usage notes.</text><text x="64" y="371" fill="#b7c8ca" font-family="Arial, sans-serif" font-size="25" font-weight="400" >A separate Python model with its own research limits.</text><path d="M64 413H1376" stroke="#33454e"/><text x="64" y="458" fill="#72ddbd" font-family="'DIN Alternate', 'Arial Narrow', Arial, sans-serif" font-size="22" font-weight="700" >3 PINE SCRIPTS</text><text x="315" y="458" fill="#f1f4ee" font-family="'DIN Alternate', 'Arial Narrow', Arial, sans-serif" font-size="21" font-weight="400" >2 SIGNAL INDICATORS</text><text x="1376" y="458" fill="#b7c8ca" font-family="'DIN Alternate', 'Arial Narrow', Arial, sans-serif" font-size="20" font-weight="400" text-anchor="end" letter-spacing="1">1 SEPARATE PYTHON RESEARCH MODEL</text><g transform="translate(1075 139)"><rect width="301" height="221" rx="12" fill="#172d37" stroke="#3e5c64"/><path d="M38 116H263" stroke="#50777b" stroke-width="2"/><circle cx="46" cy="116" r="16" fill="#101f2a" stroke="#72ddbd" stroke-width="2"/><text x="46" y="176" fill="#b7c8ca" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" letter-spacing="1">SOURCE</text><circle cx="151" cy="116" r="25" fill="#72ddbd" stroke="#72ddbd" stroke-width="2"/><path d="M141 116l7 7 13-15" stroke="#101f2a" stroke-width="3" fill="none"/><text x="151" y="176" fill="#b7c8ca" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" letter-spacing="1">USAGE</text><circle cx="256" cy="116" r="16" fill="#101f2a" stroke="#72ddbd" stroke-width="2"/><text x="256" y="176" fill="#b7c8ca" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" letter-spacing="1">EVIDENCE</text><text x="25" y="38" fill="#72ddbd" font-family="Arial, sans-serif" font-size="15" font-weight="400" letter-spacing="1">TRACEABLE DOCUMENTATION</text></g></svg>